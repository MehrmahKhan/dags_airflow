# Extra services that Astro CLI starts alongside the Airflow containers.
# Astro merges this file with its own generated compose file, so the two
# services below join the same project network that the scheduler and the
# webserver already sit on.

services:

  # ------------------------------------------------------------------
  # MongoDB: the primary database for this pipeline
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: currency_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_pass
      MONGO_INITDB_DATABASE: currency_db
    ports:
      - "27017:27017"
    volumes:
      # (b) Persistent storage, data survives a container restart or rebuild
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      # (a) Docker networking, same bridge network as the Airflow services
      - airflow
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      project: "currency-exchange-etl"
      role: "primary-database"
      maintainer: "Mehrmah Khan"

  # ------------------------------------------------------------------
  # Mongo Express: web admin interface for MongoDB, on port 8081
  # ------------------------------------------------------------------
  mongo-express:
    image: mongo-express:1.0.2
    container_name: currency_mongo_express
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongo_user
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongo_pass
      ME_CONFIG_MONGODB_URL: mongodb://mongo_user:mongo_pass@mongodb:27017/?authSource=admin
      # Basic auth disabled so the admin UI opens directly on a local machine
      ME_CONFIG_BASICAUTH: "false"
    ports:
      # Airflow already holds 8080, so the admin UI goes on 8081
      - "8081:8081"
    networks:
      - airflow
    labels:
      project: "currency-exchange-etl"
      role: "database-admin-ui"
      maintainer: "Mehrmah Khan"

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
